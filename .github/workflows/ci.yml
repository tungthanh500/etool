name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eapproval
          POSTGRES_PASSWORD: eapproval_test_pw
          POSTGRES_DB: eapproval_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eapproval"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # .env.test trỏ vào Postgres service của CI (tên DB eapproval_test — khớp guard
      # trong tests/setup.ts). JWT_SECRET/password ở đây là giá trị CI vô nghĩa, KHÔNG
      # phải secret thật.
      - name: Tạo .env.test cho CI
        run: |
          cat > .env.test <<'EOF'
          DATABASE_URL="postgresql://eapproval:eapproval_test_pw@localhost:5432/eapproval_test?schema=public"
          JWT_SECRET="ci-test-secret-0123456789abcdef"
          COOKIE_NAME="eapproval_token"
          NODE_ENV="test"
          EOF
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # npm run build = tsc -b (type-check) + vite build — phủ luôn kiểm tra kiểu.
      - run: npm ci
      - run: npm run build
