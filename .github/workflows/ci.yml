name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eapproval
          POSTGRES_PASSWORD: eapproval_test_pw
          POSTGRES_DB: eapproval_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eapproval"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      # npm ci ở ROOT cài toàn bộ workspace (shared + backend + frontend) và tạo symlink.
      - run: npm ci
      # @etool/shared phải build ra dist trước khi backend tsc/test resolve được.
      - run: npm run build:shared
      # .env.test trỏ vào Postgres service của CI (tên DB eapproval_test — khớp guard
      # trong tests/setup.ts). JWT_SECRET/password ở đây là giá trị CI vô nghĩa.
      - name: Tạo .env.test cho CI
        working-directory: backend
        run: |
          cat > .env.test <<'EOF'
          DATABASE_URL="postgresql://eapproval:eapproval_test_pw@localhost:5432/eapproval_test?schema=public"
          JWT_SECRET="ci-test-secret-0123456789abcdef"
          COOKIE_NAME="eapproval_token"
          NODE_ENV="test"
          VAPID_PUBLIC_KEY="BBnokds8OX1zxF6jDNJtwLdFlWvp1iLWNM2Pu5Y93xG1eR81Vaemqt89ie2K4fd9Pcsp3iPYHdleEGcwymCEHoo"
          VAPID_PRIVATE_KEY="waKYWFdSE0XPiQuQFOAh0LFn1kLviUktEHZX5CzAQpw"
          EOF
      - run: npx prisma generate
        working-directory: backend
      - run: npx tsc --noEmit
        working-directory: backend
      - run: npm test
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build:shared
      # npm run build = tsc -b (type-check) + vite build — phủ luôn kiểm tra kiểu.
      - run: npm run build
        working-directory: frontend
